# Blogger Auto-Poster Configuration

# Blog settings
blog_url: "https://new-news-tech-blog.blogspot.com/"

# RSS Feed
feed_url: "https://news.google.com/rss/topics/CAAqKggKIiRDQkFTRlFvSUwyMHZNRGRqTVhZU0JXVnVMVWRDR2dKSlRpZ0FQAQ?hl=en-IN&gl=IN&ceid=IN%3Aen"

# Article generation settings:
# - Option A: expand each RSS item into full article
article_mode: "expand"
min_words: 800
max_words: 1200

# SEO settings
seo:
  keywords_count: 5
  add_meta_description: true
  add_tags: true
  heading_levels: ["h2", "h3"]

# Posting settings
post_status: "LIVE"  # LIVE or DRAFT
max_posts_per_run: 3  # Limit posts per day

# Image Generation
# Tier 1: Pollinations (free, unlimited, same FLUX model)
# Tier 2: Picsum (random real photos as last resort)
# Note: Google Gemini image gen is paid-only; your API key won't work for images without billing enabled.
