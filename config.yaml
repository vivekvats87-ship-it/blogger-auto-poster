# Blogger Auto-Poster Configuration

# Blog settings
blog_url: "https://new-news-tech-blog.blogspot.com/"

# RSS Feeds (tried in order)
feed_urls:
  - "https://news.google.com/rss/topics/CAAqKggKIiRDQkFTRlFvSUwyMHZNRGRqTVhZU0JXVnVMVWRDR2dKSlRpZ0FQAQ?hl=en-IN&gl=IN&ceid=IN%3Aen"
  - "https://techcrunch.com/feed/"
  - "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
  - "https://feeds.arstechnica.com/arstechnica/index"
  - "https://www.cnet.com/rss/news/"

# Article generation settings:
# - Option A: expand each RSS item into full article
article_mode: "expand"
min_words: 2000
max_words: 3000

# SEO settings
seo:
  keywords_count: 5
  add_meta_description: true
  add_tags: true
  heading_levels: ["h2", "h3"]

# Posting settings
post_status: "LIVE"  # LIVE or DRAFT
max_posts_per_run: 10  # Limit posts per run

# Note: Image generation has been removed. Articles are text-only
# for faster publishing and better SEO performance.
