name: Blogger Auto-Poster

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:  # Allow manual trigger

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            posted_urls.db
            posted_topics.db
            token.json
          key: blogger-state-${{ github.run_id }}
          restore-keys: |
            blogger-state-
            
      - name: Create credentials files
        run: |
          echo "${{ secrets.BLOGGER_CLIENT_SECRET }}" | base64 -d > client_secret.json
          echo "${{ secrets.BLOGGER_TOKEN }}" | base64 -d > token.json
          
      - name: Run auto-poster
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python auto_poster.py
          
      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto: Hourly update - $(date '+%Y-%m-%d %H:%M UTC')"
          git push
          
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-poster-logs
          path: auto_poster.log
          retention-days: 7
